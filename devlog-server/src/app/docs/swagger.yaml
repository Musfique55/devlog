          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/v1/admin/workspaces:
    get:
      tags: [Admin]
      summary: List all workspaces
      operationId: listAllWorkspaces
      security:
        - sessionCookie: []
          accessTokenCookie: []
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/SearchTerm'
      responses:
        '200':
          description: All workspaces
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/v1/admin/users:
    get:
      tags: [Admin]
      summary: List all users
      operationId: listAllUsers
      security:
        - sessionCookie: []
          accessTokenCookie: []
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/SearchTerm'
      responses:
        '200':
          description: All users
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/v1/admin/users/{userId}:
    patch:
      tags: [Admin]
      summary: Update user activity status
      operationId: updateUserActivityStatus
      security:
        - sessionCookie: []
          accessTokenCookie: []
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateUserRequest'
      responses:
        '200':
          description: User updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: better-auth.session_token
      description: Better Auth session cookie. Use __Secure-better-auth.session_token over HTTPS.
    accessTokenCookie:
      type: apiKey
      in: cookie
      name: accessToken
      description: JWT access token cookie.

  parameters:
    WorkspaceId:
      name: workspaceId
      in: path
      required: true
      schema:
        type: string
    LogId:
      name: id
      in: path
      required: true
      schema:
        type: string
    Page:
      name: page
      in: query
      schema:
        type: integer
        minimum: 1
        default: 1
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        default: 10
    SearchTerm:
      name: searchTerm
      in: query
      schema:
        type: string
    StripeSignature:
      name: stripe-signature
      in: header
      required: true
      schema:
        type: string

  schemas:
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 6
          format: password
    RegisterRequest:
      type: object
      required: [name, email, password]
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 100
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 6
          format: password
        inviteToken:
          type: string
    CreateWorkspaceRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          maxLength: 20
    UpdateWorkspaceRequest:
      type: object
      properties:
        name:
          type: string
          maxLength: 20
        isActive:
          type: boolean
        isDeleted:
          type: boolean
    ProfileUpdateRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 100
        image:
          type: string
          format: uri
        file:
          type: string
          format: binary
    UpdateUserRequest:
      type: object
      properties:
        isBlocked:
          type: boolean
        blockedReason:
          type: string
        isDeleted:
          type: boolean
    CreateLogRequest:
      type: object
      required: [todayWork, tomorrowWork]
      properties:
        todayWork:
          type: string
        tomorrowWork:
          type: string
        blocker:
          type: string
        projectTags:
          type: array
          items:
            type: string
          maxItems: 5
        workspaceId:
          type: string
        blockerUrl:
          type: array
          items:
            type: string
            format: uri
        files:
          type: array
          maxItems: 3
          items:
            type: string
            format: binary
    User:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        email:
          type: string
          format: email
        emailVerified:
          type: boolean
        image:
          type: string
          nullable: true
        role:
          $ref: '#/components/schemas/AppRole'
        plan:
          type: string
          enum: [FREE, PRO]
        isBlocked:
          type: boolean
        isDeleted:
          type: boolean
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    AppRole:
      type: string
      description: Application-level authorization role.
      enum: [USER, SUPER_ADMIN]
    WorkspaceRole:
      type: string
      description: Workspace-level authorization role.
      enum: [MEMBER, ADMIN]
    WorkspaceMember:
      type: object
      properties:
        userId:
          type: string
        workspaceId:
          type: string
        role:
          $ref: '#/components/schemas/WorkspaceRole'
    Workspace:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        adminId:
          type: string
        isActive:
          type: boolean
        isDeleted:
          type: boolean
    StandupLog:
      type: object
      properties:
        id:
          type: string
        todayWork:
          type: string
        tomorrowWork:
          type: string
        blocker:
          type: string
          nullable: true
        blockerStatus:
          type: string
          nullable: true
        projectTags:
          type: array
          items:
            type: string
        workspaceId:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    ResponseMeta:
      type: object
      properties:
        total:
          type: integer
        page:
          type: integer
        limit:
          type: integer
        totalPages:
          type: integer
    SuccessResponse:
      type: object
      properties:
        statusCode:
          type: integer
        message:
          type: string
        success:
          type: boolean
        data:
          nullable: true
        meta:
          $ref: '#/components/schemas/ResponseMeta'
        redirect:
          type: string
          format: uri
    AuthResponse:
      allOf:
        - $ref: '#/components/schemas/SuccessResponse'
        - type: object
          properties:
            data:
              type: object
              additionalProperties: true
    UserResponse:
      allOf:
        - $ref: '#/components/schemas/SuccessResponse'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/User'
    WorkspaceResponse:
      allOf:
        - $ref: '#/components/schemas/SuccessResponse'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/Workspace'
    LogResponse:
      allOf:
        - $ref: '#/components/schemas/SuccessResponse'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/StandupLog'
    PaginatedResponse:
      allOf:
        - $ref: '#/components/schemas/SuccessResponse'
        - type: object
          properties:
            data:
              type: array
              items: {}
            meta:
              $ref: '#/components/schemas/ResponseMeta'
    ErrorResponse:
      type: object
      properties:
        statusCode:
          type: integer
        success:
          type: boolean
        message:
          type: string
        errors:
          type: array
          items:
            type: object
            properties:
              path:
                type: string
              message:
                type: string

  responses:
    BadRequest:
      description: Invalid request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unauthorized:
      description: Authentication required or invalid
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Forbidden:
      description: Insufficient permissions
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
