openapi: 3.0.3
info:
  title: DevLog API
  description: |
    REST API for the DevLog standup tracker.

    Authorization has two levels:
    - App-level role: USER or SUPER_ADMIN. Enforced by checkAuth.
    - Workspace-level role: MEMBER or ADMIN. Enforced by teamAuth for workspace resources.
    SUPER_ADMIN bypasses workspace-level membership checks.
  version: 1.0.0
servers:
  - url: http://localhost:5000
    description: Local development server
  - url: https://devlog-backend-a8sc.onrender.com
    description: Production server

tags:
  - name: System
  - name: Auth
  - name: Users
  - name: Workspaces
  - name: Logs
  - name: Invites
  - name: Dashboard
  - name: Payments
  - name: Admin

x-authorization:
  appRoles:
    USER: Standard authenticated user.
    SUPER_ADMIN: Application administrator. This role bypasses workspace membership checks.
  workspaceRoles:
    MEMBER: Workspace member. Can access member-level workspace resources.
    ADMIN: Workspace administrator. Can manage workspace members and administrator-only resources.
  enforcement:
    - middleware: checkAuth
      level: app
      values: [USER, SUPER_ADMIN]
    - middleware: teamAuth
      level: workspace
      values: [MEMBER, ADMIN]
  routeRules:
    - path: /api/v1/admin/*
      appRoles: [SUPER_ADMIN]
    - path: /api/v1/workspaces/{workspaceId}/members
      appRoles: [USER, SUPER_ADMIN]
      workspaceRoles: [MEMBER, ADMIN]
    - path: /api/v1/workspaces/{workspaceId}
      appRoles: [USER, SUPER_ADMIN]
      workspaceRoles: [MEMBER, ADMIN]
    - path: /api/v1/workspaces/{workspaceId}/stats
      appRoles: [USER, SUPER_ADMIN]
      workspaceRoles: [ADMIN]
    - path: /api/v1/workspaces/{workspaceId}/invite
      appRoles: [USER]
      workspaceRoles: [ADMIN]
    - path: /api/v1/workspaces/{workspaceId}/remove-member
      appRoles: [USER]
      workspaceRoles: [ADMIN]
    - path: /api/v1/dashboard/workspaces/{workspaceId}
      appRoles: [USER]
      workspaceRoles: [MEMBER, ADMIN]
    - path: /api/v1/logs/workspaces/{workspaceId}
      appRoles: [USER]
      workspaceRoles: [MEMBER, ADMIN]
    - path: /api/v1/logs/workspaces/{workspaceId}/blocker/{blocker}
      appRoles: [USER]
      workspaceRoles: [ADMIN]
    - path: /api/v1/logs/workspaces/{workspaceId}/blocker/{id}
      appRoles: [USER]
      workspaceRoles: [ADMIN]
    - path: /api/v1/logs/workspaces/{workspaceId}/{id}
      appRoles: [USER]
      workspaceRoles: [ADMIN]

paths:
  /health:
    get:
      tags: [System]
      summary: Health check
      operationId: healthCheck
      responses:
        '200':
          description: Service is healthy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'

