      summary: Receive Stripe webhook events
      operationId: stripeWebhook
      parameters:
        - $ref: '#/components/parameters/StripeSignature'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: Raw Stripe event payload.
      responses:
        '200':
          description: Webhook processed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '400':
          $ref: '#/components/responses/BadRequest'

  /api/docs:
    get:
      tags: [System]
      summary: OpenAPI documentation
      operationId: getApiDocs
      responses:
        '200':
          description: Swagger UI documentation page
          content:
            text/html:
              schema:
                type: string

  /api/auth/{authPath}:
    get:
      tags: [Auth]
      summary: Better Auth endpoint
      description: Handles Better Auth GET operations. Available operations depend on the Better Auth configuration.
      operationId: betterAuthGet
      parameters:
        - name: authPath
          in: path
          required: true
          schema:
            type: string
          description: Better Auth route path.
      responses:
        '200':
          description: Better Auth response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags: [Auth]
      summary: Better Auth endpoint
      description: Handles Better Auth POST operations. Available operations depend on the Better Auth configuration.
      operationId: betterAuthPost
      parameters:
        - name: authPath
          in: path
          required: true
          schema:
            type: string
          description: Better Auth route path.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        '200':
          description: Better Auth response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '401':
          $ref: '#/components/responses/Unauthorized'

